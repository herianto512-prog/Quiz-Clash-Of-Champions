<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kilat Interaktif</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .quiz-container {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .timer-bar {
            width: 100%;
            height: 8px;
            background-color: #eee;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            background-color: #ff4757;
            width: 100%;
            transition: width 1s linear;
        }
        .question {
            font-size: 18px;
            font-weight: 600;
            color: #444;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background-color: #f1f2f6;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #dfe4ea;
            border-color: #a4b0be;
        }
        .option-btn.correct {
            background-color: #2ed573 !important;
            color: white;
            border-color: #26af5f;
        }
        .option-btn.wrong {
            background-color: #ff4757 !important;
            color: white;
            border-color: #ff6b81;
        }
        .score-info {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-weight: bold;
            color: #666;
            font-size: 14px;
        }
        .hidden {
            display: none;
        }
        .restart-btn {
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        .restart-btn:hover {
            background-color: #5a6fe8;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h1 id="quiz-title">Kuis Kilat Pengetahuan</h1>
        
        <div id="quiz-box">
            <div class="timer-bar">
                <div class="timer-fill" id="timer-fill"></div>
            </div>
            <div class="score-info">
                <span id="question-number">Soal 1 dari 4</span>
                <span id="score-text">Skor: 0</span>
            </div>
            <div class="question" id="question-text">Memuat pertanyaan...</div>
            <div class="options-container" id="options-container"></div>
        </div>

        <div id="result-box" class="hidden">
            <h2>Kuis Selesai! 🎉</h2>
            <p id="final-score" style="font-size: 20px; margin: 15px 0; color: #333;"></p>
            <p id="feedback-text" style="color: #666; margin-bottom: 20px;"></p>
            <button class="restart-btn" onclick="restartQuiz()">Main Lagi</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Berapakah hasil dari 12 dikali 8?",
                options: ["84", "96", "104", "88"],
                answer: 1
            },
            {
                question: "Ibu kota negara Australia adalah...",
                options: ["Sydney", "Melbourne", "Canberra", "Perth"],
                answer: 2
            },
            {
                question: "Bahasa pemrograman apa yang berjalan di sisi browser (client-side)?",
                options: ["PHP", "Python", "JavaScript", "C++"],
                answer: 2
            },
            {
                question: "Planet apa yang dijuluki sebagai Planet Merah?",
                options: ["Venus", "Mars", "Jupiter", "Saturnus"],
                answer: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let timer;
        let timeLeft = 10;
        const TIME_PER_QUESTION = 10;

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const questionNumber = document.getElementById("question-number");
        const scoreText = document.getElementById("score-text");
        const timerFill = document.getElementById("timer-fill");
        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const finalScore = document.getElementById("final-score");
        const feedbackText = document.getElementById("feedback-text");

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            quizBox.classList.remove("hidden");
            resultBox.classList.add("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timer);
            resetTimer();

            const currentQ = quizData[currentQuestionIndex];
            questionNumber.textContent = `Soal ${currentQuestionIndex + 1} dari ${quizData.length}`;
            scoreText.textContent = `Skor: ${score}`;
            questionText.textContent = currentQ.question;
            optionsContainer.innerHTML = "";

            currentQ.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.textContent = opt;
                btn.onclick = () => selectOption(btn, index);
                optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            timeLeft = TIME_PER_QUESTION;
            updateTimerBar();
            timer = setInterval(() => {
                timeLeft--;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleTimeOut();
                }
            }, 1000);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / TIME_PER_QUESTION) * 100;
            timerFill.style.width = `${percentage}%`;
        }

        function selectOption(selectedBtn, selectedIndex) {
            clearInterval(timer);
            const currentQ = quizData[currentQuestionIndex];
            const allBtns = optionsContainer.querySelectorAll(".option-btn");

            allBtns.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQ.answer) {
                selectedBtn.classList.add("correct");
                score += 10;
            } else {
                selectedBtn.classList.add("wrong");
                allBtns[currentQ.answer].classList.add("correct");
            }

            scoreText.textContent = `Skor: ${score}`;

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1200);
        }

        function handleTimeOut() {
            const currentQ = quizData[currentQuestionIndex];
            const allBtns = optionsContainer.querySelectorAll(".option-btn");
            allBtns.forEach(btn => btn.disabled = true);
            allBtns[currentQ.answer].classList.add("correct");

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1200);
        }

        function resetTimer() {
            timeLeft = TIME_PER_QUESTION;
            updateTimerFillInstant();
        }

        function updateTimerFillInstant() {
            timerFill.style.width = "100%";
        }

        function showResult() {
            quizBox.classList.add("hidden");
            resultBox.classList.remove("hidden");
            finalScore.textContent = `Skor Anda: ${score} dari ${quizData.length * 10}`;

            let feedback = "";
            if (score === 40) feedback = "Luar biasa! Kamu jenius! 🏆";
            else if (score >= 20) feedback = "Cukup bagus, pertahankan! 👍";
            else feedback = "Yuk, coba lagi dan tingkatkan skormu! 💪";

            feedbackText.textContent = feedback;
        }

        function restartQuiz() {
            startQuiz();
        }

        // Mulai kuis saat halaman dimuat
        startQuiz();
    </script>
</body>
</html>
